name: ClearCircle checks
on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/**']
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run test:live
      - run: npm audit --omit=dev
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm audit --omit=dev
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clearcircle-browser-results
          path: |
            web/playwright-report/
            web/test-results/
            docs/screenshots/
          retention-days: 7
